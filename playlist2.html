<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>playlist</title>

<style>
body {
    margin: 0;
}

.bodyre {
    border: 10px solid #b9b3e6;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 20px;
}

.titlex {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
}

.titlex p {
    margin: 0;
}

.titlex p:nth-child(2) {
    text-align: center;
    font-weight: bold;
    font-size: 30px;
}

.sub {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 30px;
}

.box1 {
    width: 120px;
    height: 120px;
    border: 3px solid black;
    border-radius: 20px;
    overflow: hidden;
}

.box1 img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.buttons {
    display: flex;
    gap: 20px;
    margin-top: 30px;
}

.play {
    padding: 15px 30px;
    border: 3px solid black;
    border-radius: 20px;
}

.circle {
    width: 60px;
    height: 60px;
    border: 3px solid black;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.list {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 30px;
}

.album {
    width: 80px;
    height: 80px;
    border: 3px solid black;
    border-radius: 20px;
    overflow: hidden;
}

.album img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.song {
    font-size: 18px;
    margin: 0;
}

.artist {
    font-size: 13px;
    color: gray;
    margin-top: 8px;
}

.text {
    display: flex;
    flex-direction: column;
}
</style>
</head>

<body>

<div class="bodyre">

    <div class="titlex">
      <p>x</p>
      <p>playlist</p>
      <p></p>
    </div>

    <div class="sub">
      <div class="box1" id="main-album">
        <img src="subcharacter.png" />
      </div>

      <div class="text">
        <p class="song">subcharacter</p>
        <p class="artist">윤하</p>
      </div>
    </div>

    <div class="buttons">
      <div class="play">PLAY</div>
      <div class="circle">❤</div>
      <div class="circle">+</div>
    </div>

    <div class="list">
        <div class="album">
            <img src="목숨.png" />
        </div>

        <div class="text">
            <p class="song">목숨</p>
            <p class="artist">miro</p>
        </div>
    </div>

    <div class="list">
        <div class="album">
            <img src="whale.png" />
        </div>

        <div class="text">
            <p class="song">고래(whale)</p>
            <p class="artist">AKMU</p>
        </div>
    </div>

    <div class="list">
        <div class="album">
            <img src="소문의낙원.png" />
        </div>

        <div class="text">
            <p class="song">소문의낙원</p>
            <p class="artist">AKMU</p>
        </div>
    </div>

    <div class="list">
        <div class="album">
            <img src="에피소드.png" />
        </div>

        <div class="text">
            <p class="song">에피소드</p>
            <p class="artist">이무진</p>
        </div>
    </div>

</div>

</body>
</html>
