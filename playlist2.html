<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>playlist</title>

<style>
body {
    margin: 0;
}

.bodyre {
    border: 10px solid #b9b3e6;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 20px;
}

.titlex {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
}

.titlex p {
    margin: 0;
}

.titlex p:nth-child(2) {
    text-align: center;
    font-weight: bold;
}

.sub {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 30px;
}

.box1 {
    width: 120px;
    height: 120px;
    border: 3px solid black;
    border-radius: 20px;
    overflow: hidden;
}

.box1 img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}


.buttons {
    display: flex;
    gap: 20px;
    margin-top: 30px;
}

.play {
    padding: 15px 30px;
    border: 3px solid black;
    border-radius: 20px;
}

.circle {
    width: 60px;
    height: 60px;
    border: 3px solid black;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.list1 {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 30px;
}
.list2 {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 30px;
}
.box2 {
    width: 80px;
    height: 80px;
    border: 3px solid black;
    border-radius: 20px;
    overflow: hidden;
}

.box2 img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.box3 {
    width: 80px;
    height: 80px;
    border: 3px solid black;
    border-radius: 20px;
    overflow: hidden;
}

.box3 img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>

<body>

<div class="bodyre">

    <div class="titlex">
      <p>x</p>
      <p>playlist</p>
      <p></p>
    </div>

    <div class="sub">
      <div class="box1">
        <img src="subcharacter.png" />
      </div>
      <p style="font-size: 20px;">subcharacter</p>
    </div>

    <div class="buttons">
      <div class="play">PLAY</div>
      <div class="circle">❤</div>
      <div class="circle">+</div>
    </div>

    <div class="list1">
        <div class="box2">
            <img src = "목숨.png" />
        </div>
        <p style="font-size: 15px;">목숨</p>
    </div>
    <div class="list2">
        <div class="box3">
            <img src = "whale.png" />
        </div>
        <p style="font-size: 15px;">고래(whale)</p>
    </div>
</div>

</body>
</html>
